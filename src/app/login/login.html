<div class="page">
  <div class="card">

    <header class="branding">
      <div class="seal-circle">
        <img src="/Sta fe.jpg" alt="Santa Fe Municipal Seal" class="seal-image">
      </div>
      <div class="branding-text">
        <h1>Municipality of Santa Fe</h1>
        <p>Province of Leyte · Online Services Portal</p>
      </div>
    </header>
    
    <h2 *ngIf="isLogin">Citizen Login</h2>
    <h2 *ngIf="!isLogin">Citizen Registration</h2>

    <div *ngIf="isLogin">
      <div class="input-group">
        <label>Email</label>
        <input [(ngModel)]="email" type="email" placeholder="Enter your email">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input [(ngModel)]="password" type="password" placeholder="Enter your password">
      </div>

      <button (click)="Validate()">Sign In</button>

      <p class="switch">
        No account? 
        <span (click)="switchForm()">Register</span>
      </p>
    </div>

    <div *ngIf="!isLogin">
      <div class="input-group">
        <label>Email</label>
        <input [(ngModel)]="regEmail" type="email" placeholder="Create an email">
      </div>

      <div class="input-group">
        <label>Username</label>
        <input [(ngModel)]="usernameReg" type="text" placeholder="Choose a username">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input [(ngModel)]="regPassword" type="password" placeholder="Create a password">
      </div>
      <button (click)="register()">Register</button>

      <p class="switch">
        Already have an account?
        <span (click)="switchForm()">Login</span>
      </p>

      <table *ngIf="hasValidated && newuserList.length > 0" class="user-table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Username</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of newuserList">
            <td>{{user.email}}</td>
            <td>{{user.username}}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="message" *ngIf="message">{{message}}</p>

  </div>
</div>
