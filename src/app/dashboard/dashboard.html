<div class="dashboard-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="/Sta fe.jpg" alt="Seal" class="mini-logo">
      <span>BIS Panel</span>
    </div>
    <nav>
      <ul>
        <li class="active">📊 Dashboard</li>
        <li>📁 Complaints</li>
        <li>👥 Residents</li>
        <li>⚙️ Settings</li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn">Logout</button>
    </div>
  </aside>

 <div class="main-content">
  <div class="search-container">
    <input [formControl]="searchControl" type="text" placeholder="Search citizens (5s debounce)...">
  </div>

  <table class="user-table">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of paginatedData">
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
      </tr>
    </tbody>
  </table>

  <div class="pagination-bar">
    <button [disabled]="currentPage === 1" (click)="setPage(currentPage - 1)">Prev</button>
    <span>Page {{ currentPage }} of {{ totalPages || 1 }}</span>
    <button [disabled]="currentPage >= totalPages" (click)="setPage(currentPage + 1)">Next</button>
  </div>
</div>
</div>
