<div class="brgy-page">

  <div class="brgy-card">

    <img class="brgy-logo" src="/Sta fe.jpg" alt="Barangay Seal">

    <h1>Barangay Information System</h1>
    <p class="subtitle">Secure Access Login</p>

    <label>Username</label>
    <input type="text" [(ngModel)]="username" placeholder="Enter your username">

    <label>Password</label>
    <input type="password" [(ngModel)]="password" placeholder="Enter your password">

    <button (click)="login()">Login</button>

    <p class="message">{{ message }}</p>

  </div>

</div>
